version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-rocketjr
    hostname: site-rocketjr

    # Porta e networking
    ports:
      - "3000:3000"
    networks:
      - rocketjr-network

    # Variáveis de ambiente
    environment:
      # Node e Next.js
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000

      # Database - SQLite persistente
      DATABASE_URL: file:/data/dev.db

      # NextAuth
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-***REMOVIDO***}

      # Admin credentials (proteja isso com .env em produção!)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-***REMOVIDO***}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-***REMOVIDO***}

    # Persistência de dados
    volumes:
      # Banco de dados SQLite - CRÍTICO para persistência
      - rocketjr-data:/data
      # Opcional: comentários do código fonte em produção (não recomendado em prod)
      # - .:/app
      # - /app/node_modules

    # Reinício automático
    restart: unless-stopped

    # Health check para orquestração
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Recursos (opcional - ajuste conforme necessário)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

# Named volumes para persistência de dados
volumes:
  rocketjr-data:
    driver: local

# Network customizada
networks:
  rocketjr-network:
    driver: bridge
